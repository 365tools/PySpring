# 通用 Release 创建 action
#
# 从 CHANGELOG.md 提取版本对应内容（多级 fallback），并调用
# softprops/action-gh-release@v1 创建 GitHub Release。
#
# 用法（在 workflow 中）：
#   - name: 🚀 Create Release
#     uses: ./.github/actions/create-release
#     with:
#       version: "1.0.0"
#       prerelease: "true"
#       release_name_suffix: " (Test)"
#     env:
#       GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: 'Create Release from CHANGELOG'
description: 'Extract release notes from CHANGELOG.md and create a GitHub Release'

inputs:
  version:
    description: 'Release version (e.g. 0.0.1b5 or 1.0.0)'
    required: true
  tag_prefix:
    description: 'Tag prefix'
    required: false
    default: 'v'
  prerelease:
    description: 'Mark as pre-release (true/false)'
    required: false
    default: 'false'
  draft:
    description: 'Create as draft (true/false)'
    required: false
    default: 'false'
  release_name_suffix:
    description: 'Suffix appended to release title (e.g. " (Test)")'
    required: false
    default: ''
  changelog_path:
    description: 'Path to CHANGELOG.md (relative to repo root)'
    required: false
    default: 'CHANGELOG.md'
  extra_body:
    description: 'Extra Markdown appended after the changelog section'
    required: false
    default: ''
  fallback_text:
    description: 'Default text used when no changelog content is found'
    required: false
    default: 'Release version'
  files:
    description: 'Files to attach to the release (e.g. dist/*), newline-separated'
    required: false
    default: ''

outputs:
  version:
    description: 'Version used'
    value: ${{ inputs.version }}
  tag:
    description: 'Git tag created'
    value: ${{ inputs.tag_prefix }}${{ inputs.version }}
  changes:
    description: 'Extracted changelog content'
    value: ${{ steps.changelog.outputs.changes }}

runs:
  using: composite
  steps:
    - name: 📝 Extract changelog (multi-level fallback)
      id: changelog
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        CHANGELOG="${{ inputs.changelog_path }}"

        # 提取从 `## [SECTION]`（可带 ` - 日期` 后缀）到下一个 `## [` 之间的内容。
        # 用 awk 的 index() 做"字符串匹配"（非正则），避免版本号中的 `[` `]` `.`
        # 被当作正则元字符。
        extract() {
          awk -v sec="$1" 'BEGIN{found=0; buf=""; pfx="## [" sec "]"}
            /^## \[/ {
              if (found) exit
              if (index($0, pfx) == 1) {
                r = substr($0, length(pfx)+1, 1)
                if (r == "" || r == " ") found=1
              }
              next
            }
            found { buf = buf $0 "\n" }
            END { printf "%s", buf }' "$CHANGELOG"
        }
        # 判断内容是否含"有效变更"：排除说明(>)、标题(#)、分隔线(---)、空行、占位符
        has_content() {
          echo "$1" | grep -v '^[[:space:]]*$' | grep -v '^#' | grep -v '^>' \
            | grep -v '^---' | grep -v '（待补充）' | grep -q .
        }

        if [ -f "$CHANGELOG" ]; then
          # 1) 精确版本号章节
          CHANGES=$(extract "$VERSION")
          # 2) [Unreleased]（若含有效变更）
          if [ -z "$CHANGES" ]; then
            UNREL=$(extract "Unreleased")
            if has_content "$UNREL"; then CHANGES="$UNREL"; fi
          fi
          # 3) Unreleased 无有效变更 -> 下一个有实际内容的版本章节
          if [ -z "$CHANGES" ]; then
            for SEC in $(awk '/^## \[/ && $0 !~ /Unreleased/ {gsub(/^## \[/,""); gsub(/\].*$/,""); print}' "$CHANGELOG"); do
              C=$(extract "$SEC")
              if has_content "$C"; then CHANGES="$C"; break; fi
            done
          fi
          # 4) 都没有则用默认文案（不报错）
          if [ -z "$CHANGES" ]; then
            CHANGES="${{ inputs.fallback_text }} $VERSION"
          fi
        else
          CHANGES="${{ inputs.fallback_text }} $VERSION"
        fi

        echo "changes<<EOF" >> "$GITHUB_OUTPUT"
        echo "$CHANGES" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - name: 🚀 Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ inputs.tag_prefix }}${{ inputs.version }}
        name: "PySpring v${{ inputs.version }}${{ inputs.release_name_suffix }}"
        body: |
          ## PySpring v${{ inputs.version }}${{ inputs.release_name_suffix }}

          ${{ steps.changelog.outputs.changes }}
          ${{ inputs.extra_body }}
        files: ${{ inputs.files }}
        prerelease: ${{ inputs.prerelease }}
        draft: ${{ inputs.draft }}
