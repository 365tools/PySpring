name: Test - Publish to TestPyPI

# 触发条件：推送到 main 分支时自动发布到测试环境
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/**'
      - '!.github/workflows/test-publish.yml'

jobs:
  test-and-publish:
    name: Test and Publish to TestPyPI
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump_version.outputs.version }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: ⚡ Set up uv
        uses: astral-sh/setup-uv@v7

      - name: 📦 Install workspace (all packages + dev)
        run: |
          uv sync --all-packages --extra dev

      - name: 🔄 Auto-increment version (Beta, sync all packages)
        id: bump_version
        run: |
          echo "Fetching latest version from TestPyPI..."
          LATEST=$(curl -s https://test.pypi.org/pypi/pyspring/json | python -c "import sys, json; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || echo "0.0.1b0")
          echo "Latest TestPyPI version: $LATEST"

          # Check if beta version
          if [[ $LATEST =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)b([0-9]+)$ ]]; then
            MAJOR=${BASH_REMATCH[1]}
            MINOR=${BASH_REMATCH[2]}
            PATCH=${BASH_REMATCH[3]}
            BETA=$((${BASH_REMATCH[4]} + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}b${BETA}"
            echo "Incrementing beta: $LATEST -> $NEW_VERSION"
          elif [[ $LATEST =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR=${BASH_REMATCH[1]}
            MINOR=$((${BASH_REMATCH[2]} + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.0b1"
            echo "Starting new beta cycle: $LATEST -> $NEW_VERSION"
          else
            NEW_VERSION="0.0.1b1"
            echo "Using default: $NEW_VERSION"
          fi

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "📌 New version: $NEW_VERSION"

          # Sync version across root + all packages
          for f in pyproject.toml packages/*/pyproject.toml; do
            if [ -f "$f" ]; then
              sed -i "s/version = \"[^\"]*\"/version = \"$NEW_VERSION\"/" "$f"
              echo "  Updated: $f"
            fi
          done
          echo "✅ Version updated across all pyproject.toml"

      - name: 🧪 Run tests
        run: |
          uv run pytest tests/ -v || echo "⚠️ Tests failed but continuing (TestPyPI allows failed tests)"

      - name: 🔨 Build all packages
        run: |
          pip install build twine
          mkdir -p dist
          for d in packages/*/; do
            if [ -f "$d/pyproject.toml" ]; then
              echo "Building $d ..."
              python -m build --outdir dist "$d"
            fi
          done
          echo "✅ Built all packages"
          ls -lh dist/

      - name: 🔍 Check package
        run: |
          twine check dist/* || echo "⚠️ twine check warnings ignored"
          echo "✅ Package check done"

      - name: 📤 Publish to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: |
          echo "📤 Publishing to TestPyPI..."
          twine upload --repository testpypi dist/*
          echo "✅ Published successfully!"

      - name: 📝 Summary
        run: |
          echo "## 🎉 TestPyPI 发布成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本**: \`${{ steps.bump_version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 测试安装命令" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ pyspring==${{ steps.bump_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 使用 uvx 测试" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "uvx --from pyspring --index-url https://test.pypi.org/simple/ pyspring init test-project --example" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [查看 TestPyPI 包](https://test.pypi.org/project/pyspring/${{ steps.bump_version.outputs.version }}/)" >> $GITHUB_STEP_SUMMARY

  # Job 2: 自动创建 tag + 预发布 Release（基于上传成功的版本号）
  create-release:
    name: 🏷️ Create Tag & Pre-release
    runs-on: ubuntu-latest
    needs: test-and-publish
    permissions:
      contents: write
      actions: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🏷️ Create git tag (v${{ needs.test-and-publish.outputs.version }})
        run: |
          VERSION="${{ needs.test-and-publish.outputs.version }}"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "✅ Tag ${TAG} already exists, skipping"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
            echo "✅ Created and pushed tag: ${TAG}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: 📝 Extract changelog (multi-level fallback)
        id: changelog
        run: |
          VERSION="${{ needs.test-and-publish.outputs.version }}"
          # 提取从 `## [SECTION]`（可带 ` - 日期` 后缀）到下一个 `## [` 之间的内容
          # 注意：awk 正则中 `[` `]` 是字符类元字符，必须转义为 `\[` `\]`，否则
          # `[0.0.1]` 会被解释为单字符类（如 `## 0.0.1`），匹配失败导致提取为空
          extract() {
            s="## [${1}]"
            printf '%s\n' "$s" | awk '{gsub(/\[/, "\\["); gsub(/\]/, "\\]"); print}' > "/tmp/_extract_sec"
            s=$(cat "/tmp/_extract_sec")
            awk -v s="$s" 'BEGIN{found=0; buf=""}
              /^## \[/ { if (found) exit; if ($0 ~ ("^" s "( |$)")) found=1; next }
              found { buf = buf $0 "\n" }
              END { printf "%s", buf }' CHANGELOG.md
          }
          # 判断内容是否含"有效变更"：排除说明(>)、标题(#)、分隔线(---)、空行、占位符
          has_content() {
            echo "$1" | grep -v '^[[:space:]]*$' | grep -v '^#' | grep -v '^>' \
              | grep -v '^---' | grep -v '（待补充）' | grep -q .
          }
          if [ -f CHANGELOG.md ]; then
            # 1) 优先取精确版本号章节
            CHANGES=$(extract "$VERSION")
            # 2) 取 [Unreleased] 累积的未发版改动（若含有效变更）
            if [ -z "$CHANGES" ]; then
              UNREL=$(extract "Unreleased")
              if has_content "$UNREL"; then CHANGES="$UNREL"; fi
            fi
            # 3) Unreleased 无有效变更 -> 取下一个有实际内容的版本章节（如 [0.0.1]）
            if [ -z "$CHANGES" ]; then
              for SEC in $(awk '/^## \[/ && $0 !~ /Unreleased/ {gsub(/^## \[/,""); gsub(/\].*$/,""); print}' CHANGELOG.md); do
                C=$(extract "$SEC")
                if has_content "$C"; then CHANGES="$C"; break; fi
              done
            fi
            # 4) 都没有则用默认文案（不报错）
            if [ -z "$CHANGES" ]; then
              CHANGES="Test 环境发布版本 $VERSION。"
            fi
            echo "changes<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changes=Test 环境发布版本 $VERSION。" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Create Pre-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.test-and-publish.outputs.version }}
          name: "PySpring v${{ needs.test-and-publish.outputs.version }} (Test)"
          body: |
            ## 🧪 Test 环境预发布 v${{ needs.test-and-publish.outputs.version }}

            > ⚠️ 这是一个**预发布（测试/预览）**版本，由 CI 在推送时自动生成。

            ### 📝 更新内容

            ${{ steps.changelog.outputs.changes }}

            ### 📦 测试安装

            ```bash
            pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ pyspring==${{ needs.test-and-publish.outputs.version }}
            ```

            ### 🔗 相关链接
            - [TestPyPI 包](https://test.pypi.org/project/pyspring/${{ needs.test-and-publish.outputs.version }}/)
            - [发布流程文档](../docs)
          # 预发布模式：公开可见但标记为 non-production（测试/预览版）
          prerelease: true
