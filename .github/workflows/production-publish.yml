name: Production - Publish to PyPI

# 触发条件：
# 1. 创建 v*.*.* 格式的 tag（如 v1.0.0）
# 2. 手动触发（Manual workflow dispatch）
on:
  push:
    tags:
      - 'v*.*.*'  # 匹配 v1.0.0, v2.1.3 等格式
  workflow_dispatch: # 允许手动触发
    inputs:
      confirm:
        description: '⚠️ 确认发布到生产环境 PyPI？输入 "yes" 确认'
        required: true
        default: 'no'

jobs:
  # Job 1: 构建和测试
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: ⚡ Set up uv
        uses: astral-sh/setup-uv@v4

      - name: 📦 Install workspace (all packages + dev)
        run: |
          uv sync --all-packages --extra dev

      - name: 📖 Get version and tag
        id: get_version
        run: |
          VERSION=$(grep -oP 'version\s*=\s*"\K[^"]+' packages/pyspring/pyproject.toml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if version is NOT a beta version
          if [[ $VERSION =~ b[0-9]+$ ]]; then
            echo "❌ Error: Cannot publish beta version ($VERSION) to production PyPI"
            echo "Beta versions should only go to TestPyPI. Remove 'b' suffix for production release."
            exit 1
          fi

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
            echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT
            echo "📌 Tag version: v$TAG_VERSION"
            echo "📌 File version: $VERSION"

            # 检查版本号是否匹配
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "❌ Error: Tag version (v$TAG_VERSION) does not match pyproject.toml version ($VERSION)"
              exit 1
            fi
          fi

          echo "📌 Version: $VERSION"

      - name: 🧪 Run tests
        run: |
          uv run pytest tests/ -v
          echo "✅ All tests passed"

      - name: 🔨 Build all packages
        run: |
          pip install build twine
          mkdir -p dist
          for d in packages/*/; do
            if [ -f "$d/pyproject.toml" ]; then
              echo "Building $d ..."
              python -m build --outdir dist "$d"
            fi
          done
          echo "✅ Built all packages"
          ls -lh dist/

      - name: 🔍 Check package quality
        run: |
          twine check dist/*
          echo "✅ Package quality check passed"

      - name: 📦 Check package contents (aggregate pyspring templates)
        run: |
          echo "🔍 Checking wheel contents..."
          AGGREGATE_WHEEL=$(ls dist/pyspring-*.whl 2>/dev/null | head -n1)
          if [ -z "$AGGREGATE_WHEEL" ]; then
            echo "❌ Error: aggregate pyspring wheel not found"
            exit 1
          fi

          # 检查关键模板文件是否存在
          if unzip -l "$AGGREGATE_WHEEL" | grep -q "templates/example"; then
            echo "✅ Example templates found in aggregate package"
          else
            echo "❌ Error: Example templates not found in package"
            exit 1
          fi

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          retention-days: 7

  # Job 2: 等待手动批准（生产环境保护）
  await-approval:
    name: ⏸️ Await Manual Approval
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: production  # 需要在 GitHub 仓库设置中配置此环境

    steps:
      - name: 📋 Show release info
        run: |
          echo "## 🚀 准备发布到生产环境 PyPI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本**: \`${{ needs.build-and-test.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ 注意事项" >> $GITHUB_STEP_SUMMARY
          echo "- 发布到 PyPI 是**不可逆**的操作" >> $GITHUB_STEP_SUMMARY
          echo "- 版本号不能被删除或覆盖" >> $GITHUB_STEP_SUMMARY
          echo "- 请确保已经在 TestPyPI 充分测试" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ 构建检查" >> $GITHUB_STEP_SUMMARY
          echo "- 测试已通过" >> $GITHUB_STEP_SUMMARY
          echo "- 所有 7 个包已构建" >> $GITHUB_STEP_SUMMARY
          echo "- 质量检查通过" >> $GITHUB_STEP_SUMMARY
          echo "- 模板文件已包含" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 **请在 Actions 页面点击 \"Review deployments\" 批准发布**" >> $GITHUB_STEP_SUMMARY

  # Job 3: 发布到生产环境
  publish-to-pypi:
    name: 📤 Publish to PyPI
    runs-on: ubuntu-latest
    needs: [ build-and-test, await-approval ]

    # 手动触发时需要确认
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'yes')

    steps:
      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: 📤 Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install twine
          echo "📤 Publishing all packages to PyPI..."
          twine upload dist/*
          echo "✅ Published successfully!"

      - name: 🎉 Success summary
        run: |
          echo "## 🎉 PyPI 发布成功！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本**: \`${{ needs.build-and-test.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 用户安装命令" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# 临时运行（推荐给新用户）" >> $GITHUB_STEP_SUMMARY
          echo "uvx --from pyspring pyspring init my-project --example" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# 安装 CLI 工具" >> $GITHUB_STEP_SUMMARY
          echo "pipx install pyspring" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# 或使用 pip" >> $GITHUB_STEP_SUMMARY
          echo "pip install pyspring" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [查看 PyPI 包](https://pypi.org/project/pyspring/${{ needs.build-and-test.outputs.version }}/)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 后续步骤" >> $GITHUB_STEP_SUMMARY
          echo "1. 创建 GitHub Release（如果通过 tag 触发）" >> $GITHUB_STEP_SUMMARY
          echo "2. 更新文档和 CHANGELOG" >> $GITHUB_STEP_SUMMARY
          echo "3. 通知用户新版本发布" >> $GITHUB_STEP_SUMMARY

  # Job 4: 创建 GitHub Release（仅 tag 触发时）
  create-release:
    name: 📝 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ build-and-test, publish-to-pypi ]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: 📝 Extract changelog
        id: changelog
        run: |
          # 从 CHANGELOG.md 提取当前版本的更新内容
          VERSION=${{ needs.build-and-test.outputs.version }}
          if [ -f CHANGELOG.md ]; then
            CHANGES=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' | tail -n +2)
            if [ -z "$CHANGES" ]; then
              CHANGES="Release version $VERSION"
            fi
            echo "changes<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changes=Release version $VERSION" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## PySpring v${{ needs.build-and-test.outputs.version }}

            ${{ steps.changelog.outputs.changes }}

            ### 📦 安装方式

            ```bash
            # 临时运行（推荐）
            uvx --from pyspring pyspring init my-project --example

            # 安装 CLI 工具
            pipx install pyspring

            # 或使用 pip
            pip install pyspring==${{ needs.build-and-test.outputs.version }}
            ```

            ### 🔗 相关链接
            - [PyPI 包](https://pypi.org/project/pyspring/${{ needs.build-and-test.outputs.version }}/)
            - [文档](https://github.com/365tools/PySpring/tree/main/docs)
            - [更新日志](https://github.com/365tools/PySpring/blob/main/CHANGELOG.md)
          files: |
            dist/*
          draft: false
          prerelease: false
