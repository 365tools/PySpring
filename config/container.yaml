# IoC 容器配置
# 用于配置服务扫描路径和容器行为

# 服务扫描配置
scan:
  # 需要扫描的包路径列表
  # 注意: PySpring 框架核心包 (pyspring.core, security 等) 会自动扫描，无需在此配置
  # 此处仅需配置您的业务代码包
  packages:
  # - my_app.services
  # - my_app.handlers
  
  # 是否启用递归扫描（扫描子包）
  recursive: true


# 容器配置
container:
  # 是否启用懒加载（首次使用时才实例化）
  lazy_loading: true
  
  # 是否启用接口自动映射
  auto_interface_mapping: true
  
  # 是否记录详细日志
  debug: false
