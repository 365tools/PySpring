# PySpring 应用配置

# 应用基本信息
app:
  name: "PySpring Application"
  version: "1.0.0"
  description: "基于 PySpring 框架构建的应用"
  environment: "development"

# 服务器配置
server:
  host: "0.0.0.0"
  port: 8000
  reload: true
  # Uvicorn 服务器日志级别（控制启动和请求日志）
  # 可选值: DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_level: "INFO"
  workers: 1

# API 配置
api:
  prefix: "/api/v1"
  openapi_enabled: true
  docs_url: "/docs"
  redoc_url: "/redoc"

# 监控配置
monitoring:
  health_check: true
  health_check_path: "/health"

# 开发配置
development:
  debug: true
  auto_reload: true

