# 日志系统配置
# 配置 Loguru 日志系统的各项参数

# 基本配置
logging:
  # 应用日志级别（控制 Loguru 日志输出）
  # 注意：这与 application.yaml 中的 server.log_level 不同
  # - logging.level: 控制应用内部代码的日志级别
  # - server.log_level: 控制 Uvicorn 服务器的日志输出
  # 可选值: TRACE, DEBUG, INFO, SUCCESS, WARNING, ERROR, CRITICAL
  level: "INFO"
  
  # 控制台日志配置
  console:
    # 是否启用控制台输出
    enabled: true
    # 是否启用彩色输出
    colorize: true
    # 日志格式
    format: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <cyan>{extra[file_relative]}</cyan>:<cyan>{line}</cyan> | {message}"

  # 文件日志配置
  file:
    # 是否启用文件日志
    enabled: false
    # 日志文件路径（相对于项目根目录）
    path: "logs/app.log"
    # 日志轮转大小
    rotation: "10 MB"
    # 日志保留时间
    retention: "7 days"
    # 压缩格式: zip, gz, tar, tar.gz, tar.bz2
    compression: "zip"
    # 文件日志格式
    format: "{time:YYYY-MM-DD HH:mm:ss.SSS} | {level: <8} | {extra[file_relative]: <55}:{line: >4} | {message}"

  # 高级配置
  advanced:
    # 是否显示回溯信息（异常时显示完整调用栈）
    backtrace: true
    # 是否启用诊断模式（显示变量值）
    diagnose: true
    # 是否使用异步队列（提高性能）
    enqueue: true
    # 日志深度偏移（用于调整调用位置定位）
    depth_offset: 1

  # 过滤器配置（过滤特定类型的日志）
  filters:
    # 过滤健康检查请求
    health_check: true
    # 过滤指标请求
    metrics: true
    # 过滤 favicon 请求
    favicon: true
    # 自定义过滤路径列表
    custom_paths:
      - "/health"
      - "/metrics"
      - "/favicon.ico"

  # 日志拦截配置（拦截标准库日志）
  intercept:
    # 拦截 Python 标准库日志
    stdlib: true
    # 拦截 uvicorn 日志
    uvicorn: true
    # 拦截 FastAPI 日志
    fastapi: true
    # 拦截 watchfiles 日志
    watchfiles: true
    # 自定义要拦截的日志记录器名称
    custom_loggers:
      - "sqlalchemy.engine"
      - "asyncio"
