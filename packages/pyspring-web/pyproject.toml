[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspring-web"
version = "0.0.1"
authors = [
  { name="eavelabs", email="365tools.t1@gmail.com" },
]
description = "Web starter for PySpring: unified response, global exception handling."
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyspring-core>=0.0.1",
    "fastapi>=0.141.0,<1.0",
    "pydantic>=2.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.entry-points."pyspring.starters"]
pyspring-web = "pyspring.web.autoconfigure:load"

[project.urls]
"Homepage" = "https://github.com/eavelabs-community/py-spring"
"Bug Tracker" = "https://github.com/eavelabs-community/py-spring/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyspring.web*"]
namespaces = true
exclude = ["*.tests", "*.tests.*", "tests.*", "tests"]

[tool.setuptools.package-data]
"pyspring.web" = [
    "py.typed",
]

[tool.setuptools.exclude-package-data]
"pyspring.web" = [
    "**/*.log",
    "**/*.pyc",
    "**/__pycache__",
]
