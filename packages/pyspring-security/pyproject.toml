[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspring-security"
version = "0.0.1"
authors = [
  { name="eavelabs", email="365tools.t1@gmail.com" },
]
description = "Security starter for PySpring: authentication (JWT), authorization (RBAC), user management."
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyspring-core>=0.0.1",
    "pyspring-repositories>=0.0.1",
    "pyspring-web>=0.0.1",
    "pydantic>=2.13.0",
    "cryptography>=50.0.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "fastapi>=0.141.0,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.entry-points."pyspring.starters"]
pyspring-security = "pyspring.security.autoconfigure:load"

[project.urls]
"Homepage" = "https://github.com/eavelabs-community/py-spring"
"Bug Tracker" = "https://github.com/eavelabs-community/py-spring/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyspring.security*"]
namespaces = true
exclude = ["*.tests", "*.tests.*", "tests.*", "tests"]

[tool.setuptools.package-data]
"pyspring.security" = [
    "py.typed",
]

[tool.setuptools.exclude-package-data]
"pyspring.security" = [
    "**/*.log",
    "**/*.db",
    "**/*.sqlite",
    "**/*.pyc",
    "**/__pycache__",
]
