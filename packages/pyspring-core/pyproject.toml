[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspring-core"
version = "0.0.1"
authors = [
  { name="eavelabs", email="365tools.t1@gmail.com" },
]
description = "Core of PySpring: IoC container, AOP, logging, config."
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.13.0",
    "pydantic-core>=2.46.0",
    "pydantic-settings>=2.15.0",
    "loguru>=0.7.3",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.entry-points."pyspring.starters"]
pyspring-core = "pyspring.core.autoconfigure.core_starter:load"

[project.urls]
"Homepage" = "https://github.com/eavelabs-community/py-spring"
"Bug Tracker" = "https://github.com/eavelabs-community/py-spring/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyspring.core*"]
namespaces = true
exclude = ["*.tests", "*.tests.*", "tests.*", "tests"]

[tool.setuptools.package-data]
"pyspring.core" = [
    "py.typed",
]

[tool.setuptools.exclude-package-data]
"pyspring.core" = [
    "**/*.log",
    "**/*.db",
    "**/*.sqlite",
    "**/*.pyc",
    "**/__pycache__",
]
