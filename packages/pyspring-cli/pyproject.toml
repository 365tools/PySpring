[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspring-cli"
version = "0.0.1"
authors = [
  { name="Yingchun", email="allureyc@gmail.com" },
]
description = "Command-line development tools for PySpring Framework"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "pyspring>=0.0.1",  # Core framework dependency
                  # For local development: pip install -e ../pyspring
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["../../tests"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyspring.cli*"]
namespaces = true
exclude = ["*.tests", "*.tests.*", "tests.*", "tests"]

[project.urls]
"Homepage" = "https://github.com/365tools/PySpring"
"Bug Tracker" = "https://github.com/365tools/PySpring/issues"
"Documentation" = "https://github.com/365tools/PySpring/tree/main/docs"

# CLI entry point
[project.scripts]
pyspring = "pyspring.cli.main:main"
