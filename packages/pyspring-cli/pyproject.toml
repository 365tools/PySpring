[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspring-cli"
version = "1.0.0"
authors = [
  { name="Yingchun", email="allureyc@gmail.com" },
]
description = "Command-line development tools for PySpring Framework"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "pyspring>=1.1.0",  # Core framework dependency
                  # For local development: pip install -e ../pyspring
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["../../tests"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyspring_cli*"]
exclude = ["*.tests", "*.tests.*", "tests.*", "tests"]

[project.urls]
"Homepage" = "https://github.com/365tools/PySpring"
"Bug Tracker" = "https://github.com/365tools/PySpring/issues"
"Documentation" = "https://github.com/365tools/PySpring/tree/main/docs"

# CLI entry point
[project.scripts]
pyspring = "pyspring_cli.main:main"
