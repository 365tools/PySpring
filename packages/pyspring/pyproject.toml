[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspring"
version = "0.0.1"
authors = [
  { name="Yingchun", email="allureyc@gmail.com" },
]
description = "A SpringBoot-style scaffold for FastAPI with IoC and Auto-Configuration."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyspring-core>=0.0.1",
    "pyspring-web>=0.0.1",
    "pyspring-repositories>=0.0.1",
    "pyspring-security>=0.0.1",
    "fastapi>=0.104.0,<1.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.0.0",
    "pydantic-core>=2.10.1",
    "pydantic-settings>=2.0.0",
    "pydantic[email]>=2.0.0",
    "dependency_injector>=4.42.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "fastapi-users[sqlalchemy]>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]
# full：全功能安装入口（文档公开承诺的安装方式）。当前所有核心功能均为默认 dependencies，故 full 不额外引入依赖。
full = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../../tests"]



[tool.uv]
package = true

[project.urls]
"Homepage" = "https://github.com/365tools/PySpring"
"Bug Tracker" = "https://github.com/365tools/PySpring/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyspring*"]
namespaces = true
exclude = ["*.tests", "*.tests.*", "tests.*", "tests"]

[tool.setuptools.package-data]
pyspring = [
    "py.typed",
    "templates/**/*",
    "templates/**/*.template",
    "templates/**/*.yaml",
    "templates/config/*.yaml",
    "templates/app/*.template",
    "templates/project/*.template",
    "templates/example/**/*",
    "templates/example/**/*.template",
]

[tool.setuptools.exclude-package-data]
pyspring = [
    "**/*.json",
    "**/*.log",
    "**/*.db",
    "**/*.sqlite",
    "**/*.pyc",
    "**/__pycache__",
]