# IoC 容器配置示例
# 复制此文件为 container.yaml 并根据需要修改

# 服务扫描配置
scan:
  # 需要扫描的包路径列表
  # 示例：添加自定义服务包
  packages:
    - src.pyspring.repositories
    - src.pyspring.security
    - src.pyspring.system
    - src.pyspring.log
    # - your.custom.package  # 添加您的自定义包路径
  
  # 是否启用递归扫描（扫描子包）
  recursive: true
  
  # 服务类名后缀（用于识别服务类）
  service_suffix: "Service"

# 容器配置
container:
  # 是否启用懒加载（首次使用时才实例化）
  lazy_loading: true
  
  # 是否启用接口自动映射
  auto_interface_mapping: true
  
  # 是否记录详细日志（开发环境建议开启）
  debug: false

# 注意事项：
# 1. 包路径必须是有效的 Python 模块路径
# 2. 所有以 service_suffix 结尾的类都会被识别为服务类
# 3. 实现了 ISingletonService 接口的服务会被注册为单例
# 4. 其他服务默认注册为工厂模式（每次请求创建新实例）
