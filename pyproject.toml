[project]
name = "pyspring-workspace"
version = "0.0.1"
description = "PySpring Framework and CLI Tools Development Workspace"
authors = [{ name = "eavelabs", email = "365tools.t1@gmail.com" }]
requires-python = ">=3.14"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
dev = [
    "pyspring>=0.0.1",
    "pyspring-cli>=0.0.1",
    "pyspring-health>=0.0.1",
    "pyspring-core>=0.0.1",
    "pyspring-web>=0.0.1",
    "pyspring-repositories>=0.0.1",
    "pyspring-security>=0.0.1",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.6.0",
]
full = [
    "pyspring[full]>=0.0.1",
]

[tool.uv.workspace]
members = [
    "packages/pyspring",
    "packages/pyspring-cli",
    "packages/pyspring-health",
    "packages/pyspring-core",
    "packages/pyspring-web",
    "packages/pyspring-repositories",
    "packages/pyspring-security",
]

[tool.uv.sources]
pyspring = { workspace = true }
pyspring-cli = { workspace = true }
pyspring-health = { workspace = true }
pyspring-core = { workspace = true }
pyspring-web = { workspace = true }
pyspring-repositories = { workspace = true }
pyspring-security = { workspace = true }

# This is a workspace file that manages dependencies and workspace members
# It does not need a build system as it's not meant to be packaged itself


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-n", "auto"]
markers = [
    "slow: slow-running tests (e.g. basedpyright full type-check)",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# E: pycodestyle 错误, F: Pyflakes（真实 bug）, I: isort（导入排序）
# 不含 N（pep8-naming）——项目刻意用类名命名变量（如 UserTable/RoleTable）
#     对标 Spring 风格，命名规则会误报
# 不含 W（whitespace）——尾随空格等风格噪音不阻塞 CI
select = ["E", "F", "I"]
ignore = [
    "E501",  # 行过长（项目用 120 列，部分 docstring/示例超长）
    "E701",  # 单行 if（如 `if x: return y`）是可读的紧凑惯用法
]

[tool.ruff.lint.per-file-ignores]
# __init__.py 的 re-export（from .x import Y）是 Python 标准模式：
# 通过 import_package() 动态导出符号，静态的 F401 未使用导入属于误报。
"__init__.py" = ["F401"]
# tests/conftest.py 需在动态 sys.path 设置（editable 安装兜底）之后才能 import
# pyspring 包，因此 E402（import 不在顶部）是合理的，无法避免。
"tests/conftest.py" = ["E402"]

