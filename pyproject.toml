[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspring"
version = "1.1.0b1"
authors = [
  { name="Yingchun", email="allureyc@gmail.com" },
]
description = "A SpringBoot-style scaffold for FastAPI with IoC and Auto-Configuration."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.0.0",
    "pydantic-core>=2.10.1",
    "pydantic-settings>=2.0.0",
    "pydantic[email]>=2.0.0",
    "dependency_injector>=4.42.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "fastapi-users[sqlalchemy]>=13.0.0",
]

[project.optional-dependencies]
# 开发工具依赖（包含 CLI 工具�?
cli = [
    # CLI 工具目前只依赖标准库，但保留�?extra 用于未来扩展
    # 例如：可能添�?rich、click 等增�?CLI 体验的库
]

# 开发环境依赖（测试、格式化、类型检查等�?
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

# 完整开发环境（包含 CLI + 开发工具）
full = [
    "pyspring[cli,dev]",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = true

[project.urls]
"Homepage" = "https://github.com/365tools/PySpring"
"Bug Tracker" = "https://github.com/365tools/PySpring/issues"

# CLI 命令入口（始终可用，但可通过文档引导用户按需安装�?
[project.scripts]
pyspring = "pyspring.cli.main:main"

# 注意�?
# - 生产环境：pip install pyspring（CLI 会被安装但不使用�?
# - 开发环境：pip install pyspring[cli] �?pyspring[full]（明确安�?CLI�?
# - 或使用临时执行：uvx --from pyspring pyspring init（无需安装�?

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyspring*"]
exclude = ["*.tests", "*.tests.*", "tests.*", "tests"]

[tool.setuptools.package-data]
pyspring = [
    "templates/**/*",
    "templates/**/*.template",
    "templates/**/*.yaml",
    "templates/config/*.yaml",
    "templates/app/*.template",
    "templates/project/*.template",
    "templates/example/**/*",
    "templates/example/**/*.template",
]

[tool.setuptools.exclude-package-data]
pyspring = [
    "**/*.json",
    "**/*.log",
    "**/*.db",
    "**/*.sqlite",
    "**/*.pyc",
    "**/__pycache__",
]
